<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meshline WiFi</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meshline WiFi">
  <meta name="theme-color" content="#12BC00">
  <link rel="apple-touch-icon" href="/logo.png">
  <link href="/vendor/fonts/poppins/poppins.css" rel="stylesheet">
  <link href="/vendor/css/font-awesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/css/leaflet.css" />
  <script src="/vendor/js/tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: {
        fontFamily: { sans: ['Poppins', 'sans-serif'] },
        extend: {
          colors: {
            brand: { 50: '#E8F5E9', 100: '#E8F5E9', 200: '#A5D6A7', 300: '#A5D6A7', 400: '#66BB6A', 500: '#12BC00', 600: '#0FA300', 700: '#0B8A00', 800: '#086600', 900: '#054400' }
          }
        }
      }
    }
  </script>
  <script defer src="/vendor/js/leaflet.js"></script>
  <script defer src="/vendor/js/chart.umd.min.js"></script>
  <script type="module" src="/src/main.js"></script>
  <script>
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('appinstallavailable'));
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {});
      });
    }
  </script>
</head>
<body style="background:#0a0a0f;margin:0;padding:0">
  <div id="app"></div>
</body>
</html>
